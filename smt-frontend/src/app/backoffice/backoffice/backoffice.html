<div class="app-shell">

  <!-- =========================================================
       BACKDROP MOBILE
       ========================================================= -->
  <div
    class="sidebar-backdrop"
    [class.show]="mobileSidebarOpen"
    (click)="closeMobileSidebar()">
  </div>


  <!-- =========================================================
       SIDEBAR
       ========================================================= -->
  <aside
    class="sidebar"
    [class.collapsed]="sidebarCollapsed"
    [class.mobile-open]="mobileSidebarOpen">


    <!-- ================= BRAND ================= -->
    <div class="sidebar-brand">

      <svg
        class="mt-logo-mark"
        viewBox="0 0 48 48"
        fill="none"
        xmlns="http://www.w3.org/2000/svg">

        <polygon
          points="6,38 18,16 26,28 32,18 42,38"
          fill="#F8FAFC"/>

        <polygon
          points="18,16 26,28 22,28 16,20"
          fill="#F2B705"/>

        <polygon
          points="32,18 42,38 36,38 30,24"
          fill="#F2B705"/>

      </svg>


      <div class="sidebar-brand-text">

        <div class="name">
          MINER<span class="brand-accent">TRANS</span>
        </div>

        <div class="tag">
          SISTEMA DE TRANSPORTE
        </div>

      </div>

    </div>


    <!-- =====================================================
         NAVEGACIÓN
         ===================================================== -->
    <nav class="sidebar-nav">
      <ng-container *ngFor="let m of modules">
        <div class="sidebar-section-label">
          {{m.name}}
        </div>
        <a
          *ngFor="let c of m.children"
          [routerLink]="c.route"
          class="nav-link"
          [class.active]="activeModule === c.label"
          title="{{c.label}}"
          (click)="$event.preventDefault(); selectModule(c.label)">
  
          <i class="{{c.icon}}"></i>
  
          <span class="link-label">
            {{c.label}}
          </span>

        </a>
      </ng-container>
    </nav>


    <!-- =====================================================
         SIDEBAR FOOTER
         ===================================================== -->
    <div class="sidebar-footer">

      <button
        type="button"
        class="sidebar-collapse-btn"
        title="Contraer / expandir menú"
        (click)="toggleSidebar()">

        <i
          class="fa-solid"
          [class.fa-angles-left]="!sidebarCollapsed"
          [class.fa-angles-right]="sidebarCollapsed">
        </i>

        <span class="btn-label">
          {{ sidebarCollapsed ? 'Expandir menú' : 'Contraer menú' }}
        </span>

      </button>

    </div>

  </aside>


  <!-- =========================================================
       CONTENIDO
       ========================================================= -->
  <div class="content-col">


    <!-- =======================================================
         TOPBAR
         ======================================================= -->
    <header class="topbar">


      <!-- ================= TÍTULO ================= -->
      <div class="topbar-title">

        <!-- Mobile -->
        <button
          type="button"
          class="topbar-mobile-toggle"
          (click)="openMobileSidebar()"
          aria-label="Abrir menú">

          <i class="fa-solid fa-bars"></i>

        </button>


        <!-- Título dinámico -->
        <h1>
          {{ activeModule }}
        </h1>

      </div>


      <!-- ================= ACCIONES ================= -->
      <div class="topbar-actions">


        <!-- Notificaciones -->
        <button
          type="button"
          class="topbar-icon-btn"
          title="Notificaciones">

          <i class="fa-regular fa-bell"></i>

          <span class="dot"></span>

        </button>


        <!-- =================================================
             MENÚ USUARIO
             ================================================= -->
        <div
          class="user-menu"
          (click)="$event.stopPropagation()">


          <!-- Trigger -->
          <button
            type="button"
            class="user-menu-trigger"
            (click)="toggleUserMenu($event)">


            <!-- Avatar -->
            <div class="user-avatar">
              {{userLoged.first_name.substring(0,1) | uppercase}}{{userLoged.last_name.substring(0,1) | uppercase}}
            </div>


            <!-- Datos usuario -->
            <div class="user-meta d-none d-sm-block">

              <span class="u-name">
                {{userLoged.first_name}} {{userLoged.last_name}}
              </span>

              <span class="u-role">
                {{userLoged.currentRole.role | uppercase}}
              </span>

            </div>


            <!-- Flecha -->
            <i
              class="fa-solid fa-chevron-down chev">
            </i>

          </button>


          <!-- =================================================
               DROPDOWN
               ================================================= -->
          <div
            class="user-dropdown"
            [class.show]="userDropdownOpen">


            <!-- Header -->
            <div class="user-dropdown-header">

              <span class="u-name">
                {{userLoged.first_name}} {{userLoged.last_name}}
              </span>

              <span class="u-email">
                {{userLoged.email}}
              </span>

            </div>


            <!-- Perfil -->
            <a
              [routerLink]="['/backoffice/perfil']">

              <i class="fa-regular fa-user"></i>

              Mi perfil

            </a>


            <!-- Cambiar perfil -->
            <a
              [routerLink]="['/autenticacion/seleccionar-perfil']">

              <i class="fa-solid fa-right-left"></i>

              Cambiar perfil

            </a>


            <!-- Configuración -->
            <a
              [routerLink]="['/backoffice/configuracion']">

              <i class="fa-solid fa-gear"></i>

              Configuración

            </a>


            <hr>


            <!-- Logout -->
            <a
              href="index.html"
              class="logout">

              <i class="fa-solid fa-right-from-bracket"></i>

              Cerrar sesión

            </a>

          </div>

        </div>

      </div>

    </header>


    <!-- =======================================================
         CONTENIDO PRINCIPAL
         ======================================================= -->
    <main class="main-content">


      <!-- Breadcrumb -->
      <div class="breadcrumb-bar">

        <a
          href="#"
          (click)="$event.preventDefault()">

          Inicio

        </a>

        <span>/</span>

        <span class="current">
          {{ activeModule }}
        </span>

      </div>


      <!-- =====================================================
           CONTENIDO DINÁMICO
           ===================================================== -->
      <div class="placeholder-panel">
        <router-outlet />
<!-- 
        <i class="fa-solid fa-cubes-stacked"></i>

        <h5>
          {{ activeModule }}
        </h5>

        <p class="mb-0">
          Este módulo se reemplazará con el contenido
          correspondiente a cada sección.
        </p> -->

      </div>

    </main>

  </div>

</div>
