<!-- ==================================================================
     new-user.html  — Modal Nuevo / Editar Usuario
     ================================================================== -->
<div class="modal-header">
  <h4 class="modal-title pull-left">{{ new_user && new_user.editing ? 'Editar' : 'Nuevo' }}&nbsp;Usuario</h4>
  <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef.hide()">
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="row">
    <div class="col-md-6">
      <div class="form-group">
        <small class="text-secondary">Nombres</small>
        <input type="text" name="first_name" [(ngModel)]="new_user.first_name" class="form-control" placeholder="Jorge">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <small class="text-secondary">Apellidos</small>
        <input type="text" name="last_name" [(ngModel)]="new_user.last_name" class="form-control" placeholder="Paredes Luna">
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div class="form-group">
        <small class="text-secondary">Documento de identidad</small>
        <input type="text" name="document_id" maxlength="8" [(ngModel)]="new_user.document_id" class="form-control" placeholder="45782190">
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <small class="text-secondary">Teléfono</small>
        <input type="text" name="phone" maxlength="9" [(ngModel)]="new_user.phone" class="form-control" placeholder="987654321">
      </div>
    </div>
  </div>

  <div class="form-group">
    <small class="text-secondary">Correo electrónico</small>
    <input type="email" name="email" [(ngModel)]="new_user.email" class="form-control" placeholder="jorge.paredes@empresa.pe">
  </div>

  <div class="form-group" *ngIf="!new_user.editing">
    <small class="text-secondary">Contraseña temporal</small>
    <div class="input-group">
      <input type="{{showPassword ? 'text' : 'password'}}" name="password_hash" [(ngModel)]="new_user.password_hash" class="form-control" placeholder="••••••••">
      <button class="btn btn-light" (click)="togglePassword()">
        <i class="fa" [ngClass]="{'fa-eye-slash': showPassword, 'fa-eye': !showPassword}"></i>
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <small class="text-secondary">Rol</small>
      <select name="role" [(ngModel)]="new_user.role" class="form-select">
        <option [ngValue]="undefined">--SELECCIONE--</option>
        <option *ngFor="let r of roles" [ngValue]="r.id">{{r.name | uppercase}}</option>
      </select>
    </div>
    <div class="col-md-6">
      <div class="form-group form-check mt-3">
        <input type="checkbox" name="has_2fa" [(ngModel)]="new_user.has_2fa" class="form-check-input" id="has2faDriver">
        <label class="form-check-label" for="has2faDriver">
          <small class="text-secondary">Autenticación 2FA</small>
        </label>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer text-center">
  <button class="btn btn-primary" [disabled]="inserting" (click)="save()">
    <i class="fa fa-save me-1"></i>Guardar
  </button>
</div>
