<!-- ==================================================================
     new-incident.html  — Modal Nuevo / Editar Incidente
     ================================================================== -->
<div class="modal-header">
  <h4 class="modal-title pull-left">{{ new_incident && new_incident.editing ? 'Editar' : 'Nuevo' }}&nbsp;Incidente</h4>
  <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef.hide()">
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="form-group">
    <small class="text-secondary">Viaje / Asignación relacionada</small>
    <select name="assignment_id" [(ngModel)]="new_incident.assignment_id" class="form-select">
      <option [ngValue]="undefined">--SELECCIONAR--</option>
      <option *ngFor="let a of assignments" [ngValue]="a.id">
        {{a.route?.name}} — {{a.vehicle?.license_plate}}
      </option>
    </select>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div class="form-group">
        <small class="text-secondary">Tipo de incidente</small>
        <select name="incident_type" [(ngModel)]="new_incident.incident_type" class="form-select">
          <option [ngValue]="undefined">--SELECCIONAR--</option>
          <option *ngFor="let it of incident_types" [ngValue]="it.id">{{it.name}}</option>
        </select>
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <small class="text-secondary">Severidad</small>
        <select name="severity" [(ngModel)]="new_incident.severity" class="form-select">
          <option *ngFor="let s of severities" [ngValue]="s.id">{{s.name}}</option>
        </select>
      </div>
    </div>
  </div>

  <div class="form-group">
    <small class="text-secondary">Descripción</small>
    <textarea name="description" [(ngModel)]="new_incident.description" class="form-control" rows="3" placeholder="Describe lo ocurrido..."></textarea>
  </div>

  <div class="row">
    <div class="col-md-6">
      <div class="form-group form-check mt-3">
        <input type="checkbox" name="is_resolved" [(ngModel)]="new_incident.is_resolved" class="form-check-input" id="isResolvedIncident">
        <label class="form-check-label" for="isResolvedIncident">
          <small class="text-secondary">Incidente resuelto</small>
        </label>
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group form-check mt-3">
        <input type="checkbox" name="has_insurance_claim" [(ngModel)]="new_incident.has_insurance_claim" class="form-check-input" id="hasInsuranceClaim">
        <label class="form-check-label" for="hasInsuranceClaim">
          <small class="text-secondary">Tiene reclamo de seguro</small>
        </label>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer text-center">
  <button class="btn btn-primary" [disabled]="inserting" (click)="save()">
    <i class="fa fa-save me-1"></i>Guardar
  </button>
</div>
