<div class="profile-select-screen">

  <div class="profile-select-brand">
    <svg width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="6,38 18,16 26,28 32,18 42,38" fill="#F8FAFC"/>
      <polygon points="18,16 26,28 22,28 16,20" fill="#F2B705"/>
      <polygon points="32,18 42,38 36,38 30,24" fill="#F2B705"/>
    </svg>
    <span class="text-white fw-bold fs-5">MINER<span class="text-warning">TRANS</span></span>
  </div>

  <div class="profile-select-heading">
    <h1>¿Con qué empresa deseas ingresar?</h1>
    <p>Hola, <strong class="text-white">{{userLoged.first_name}} {{userLoged.last_name}}</strong>. Tu cuenta está vinculada a más de una compañía.</p>
  </div>

  <div class="profile-grid" *ngIf="userLoged.companies">
    <div class="row g-4 justify-content-center">

      <!-- Empresa 1: un solo rol asignado -> entra directo al backoffice -->
      <div class="col-lg-4 col-md-6" *ngFor="let c of userLoged.companies">
        <div class="profile-card">
          <span class="profile-badge"><i class="fa-solid fa-circle" style="font-size:6px;"></i> Activa</span>
          <div class="profile-avatar"><i class="fa-solid fa-building"></i></div>
          <div class="profile-role">{{c.name}}</div>
          <div class="profile-site">{{c.roles.length}} {{c.roles.length > 1 ? 'roles asignados' : 'rol asignado'}} · <span *ngFor="let r of c.roles">{{r.role}}</span></div>
          <button type="button" class="btn btn-outline-primary" (click)="selectCompany(c)">Ingresar</button>
        </div>
      </div>

    </div>
  </div>

  <div class="profile-select-footer">
    <a href="index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión</a>
  </div>

</div>
