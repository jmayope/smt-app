<div class="profile-select-screen">

  <div class="profile-select-brand">
    <svg width="34" height="34" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="6,38 18,16 26,28 32,18 42,38" fill="#F8FAFC"/>
      <polygon points="18,16 26,28 22,28 16,20" fill="#F2B705"/>
      <polygon points="32,18 42,38 36,38 30,24" fill="#F2B705"/>
    </svg>
    <span class="text-white fw-bold fs-5">MINER<span class="text-warning">TRANS</span></span>
  </div>

  <div class="profile-select-heading">
    <h1>¿Con qué perfil deseas ingresar?</h1>
    <p>Hola, <strong class="text-white">Carlos Ramírez</strong>. Selecciona uno de tus perfiles asignados para continuar.</p>
  </div>

  <div class="profile-grid">
    <div class="row g-4 justify-content-center">

      <div class="col-lg-4 col-md-6" *ngFor="let r of userLoged.currentCompany.roles">
        <div class="profile-card">
          <span class="profile-badge"><i class="fa-solid fa-circle" style="font-size:6px;"></i> {{r.is_active ? 'ACTIVO' : 'INACTIVO'}}</span>
          <div class="profile-avatar"><i class="fa-solid fa-user-tie"></i></div>
          <div class="profile-role">{{r.role | uppercase}}</div>
          <div class="profile-site">
            <span class="badge" [ngClass]="{'bg-primary': r.role === 'admin', 'bg-success': r.role !== 'admin'}" >{{r.role === 'admin' ? 'Administrador' : 'Usuario Común'}}</span>
            <span class="badge bg-light text-dark">
              <i class="fa me-1" [ngClass]="{'fa-check text-success': r.has_access_all, 'fa-times text-danger': !r.has_access_all}"></i>Acceso Total
            </span>
          </div>
          <button class="btn btn-outline-primary" (click)="selectProfile(r)">Ingresar</button>
        </div>
      </div>

    </div>
  </div>

  <div class="profile-select-footer">
    <a [routerLink]="['/autenticacion/seleccionar-empresa']" *ngIf="userLoged.companies.length > 1" class="me-5"><i class="fa-solid fa-home"></i> Cambiar de Empresa</a>
    <a [routerLink]="['/autenticacion/iniciar-sesion']" class="ms-5"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar sesión</a>
  </div>

</div>
